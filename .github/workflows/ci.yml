name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

  deploy:
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      DEPLOY_BASE_PATH: ${{ secrets.DEPLOY_BASE_PATH }}
    steps:
      - name: Deploy to Tencent Cloud CVM
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          envs: DEPLOY_BASE_PATH
          script: |
            set -euo pipefail
            BASE="${DEPLOY_BASE_PATH:-$HOME/ai-cs}"
            cd "$BASE/ai-cs-web-h5"
            git pull --ff-only
            npx --yes pnpm@9.15.4 install --frozen-lockfile
            npx --yes pnpm@9.15.4 build
            sudo systemctl reload nginx
